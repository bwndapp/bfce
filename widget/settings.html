<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>bbot settings</title>
    <style>
      :root {
        --bg: rgba(14, 16, 19, 0.97);
        --line: rgba(255, 255, 255, 0.08);
        --text: #d7dbdf;
        --dim: #878e95;
        --chip: rgba(255, 255, 255, 0.05);
        --chip-hover: rgba(255, 255, 255, 0.11);
        --accent: #8ab4ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #card {
        box-sizing: border-box;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 16px;
        color: var(--text);
        font: 12px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
        flex: none;
      }
      header .dot {
        width: 22px;
        height: 22px;
        flex: none;
      }
      header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        flex: 1;
      }
      #x {
        -webkit-app-region: no-drag;
        border: none;
        background: none;
        color: var(--dim);
        font-size: 13px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
      }
      #x:hover {
        background: var(--chip-hover);
        color: #fff;
      }
      /* left tab rail */
      #body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      nav {
        width: 62px;
        flex: none;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 7px;
      }
      .tab {
        position: relative;
        border: none;
        background: none;
        border-radius: 10px;
        color: var(--dim);
        padding: 12px 2px;
        display: flex;
        justify-content: center;
        cursor: pointer;
        font: 600 10px system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .tab:hover {
        background: var(--chip);
        color: var(--text);
      }
      .tab.active {
        background: rgba(138, 180, 255, 0.12);
        color: var(--accent);
      }
      .tab.ext {
        font-size: 9px;
        padding: 8px 2px;
        opacity: 0.75;
      }
      .tabdot {
        position: absolute;
        top: 6px;
        right: 8px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dim);
        transition: background 0.2s;
      }
      .tabdot.on {
        background: #5dd39e;
        box-shadow: 0 0 6px #5dd39e;
      }
      .tabdot.connecting {
        background: #ffd166;
        animation: pulse 1s infinite;
      }
      .tabdot.denied {
        background: #ff6b6b;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      main {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 12px 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      main::-webkit-scrollbar {
        width: 8px;
      }
      main::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .pane {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      section > h2 {
        margin: 0 0 7px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      /* mood gallery */
      #autoChip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 8px;
      }
      .chip {
        border: 1px solid transparent;
        background: var(--chip);
        color: var(--text);
        font: inherit;
        border-radius: 999px;
        padding: 4px 11px;
        cursor: pointer;
        transition: background 0.12s, transform 0.05s;
      }
      .chip:hover {
        background: var(--chip-hover);
      }
      .chip:active {
        transform: scale(0.94);
      }
      .chip.selected {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(138, 180, 255, 0.1);
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
        gap: 6px;
      }
      .cell {
        border: 1px solid transparent;
        background: var(--chip);
        border-radius: 11px;
        padding: 5px 2px 2px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        transition: background 0.12s;
      }
      .cell:hover {
        background: var(--chip-hover);
      }
      .cell.selected {
        border-color: var(--accent);
        background: rgba(138, 180, 255, 0.1);
      }
      .cell .mini {
        width: 34px;
        height: 34px;
        pointer-events: none;
      }
      .cell .name {
        font-size: 8.5px;
        color: var(--dim);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cell.selected .name {
        color: var(--accent);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      /* colors */
      .crow {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 7px;
      }
      .crow > .lbl {
        width: 34px;
        flex: none;
        color: var(--dim);
      }
      .crow > .chips {
        flex: 1;
        align-items: center;
      }
      .swatch {
        width: 21px;
        height: 21px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 0;
        cursor: pointer;
        flex: none;
      }
      .swatch.selected {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      input[type='color'] {
        width: 23px;
        height: 23px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
      }
      input[type='color']::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type='color']::-webkit-color-swatch {
        border: 1px dashed rgba(255, 255, 255, 0.45);
        border-radius: 50%;
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        color: var(--text);
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      select {
        background: #1c1f22;
        color: var(--text);
        border: 1px solid #333;
        border-radius: 5px;
        font: inherit;
        max-width: 90px;
      }
      /* config pane */
      .field-input {
        flex: 1;
        box-sizing: border-box;
        background: #1c1f22;
        border: 1px solid #33383d;
        border-radius: 7px;
        color: var(--text);
        font: 11px system-ui, sans-serif;
        padding: 6px 9px;
        outline: none;
        min-width: 0;
      }
      .field-input:focus {
        border-color: var(--accent);
      }
      .conn-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      #go {
        border: none;
        border-radius: 999px;
        padding: 6px 16px;
        font: 600 11px system-ui, sans-serif;
        cursor: pointer;
        background: var(--accent);
        color: #0c0e11;
      }
      #go:hover {
        filter: brightness(1.1);
      }
      #go.on {
        background: var(--chip);
        color: var(--text);
        border: 1px solid var(--line);
      }
      #connStatus {
        font-size: 10.5px;
        color: var(--dim);
      }
      #connStatus b {
        color: var(--text);
      }
      #bot {
        flex: 1;
        max-width: none;
        padding: 5px 8px;
      }
      .hint {
        font-size: 10.5px;
        color: var(--dim);
        line-height: 1.5;
      }
      .hint a {
        color: var(--accent);
        text-decoration: none;
      }
      .hint a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <header>
        <div class="dot" id="headFace"></div>
        <h1>bbot</h1>
        <button id="x" title="Close">✕</button>
      </header>
      <div id="body">
        <nav>
          <button class="tab active" data-tab="custom">style</button>
          <button class="tab" data-tab="config">config<span class="tabdot" id="tabDot"></span></button>
          <span style="flex: 1"></span>
          <button class="tab ext" id="lnkSite" title="bbot.bwnd.app">site</button>
          <button class="tab ext" id="lnkRepo" title="Star bbot on GitHub">github</button>
        </nav>
        <main>
          <div class="pane" id="pane-custom">
            <section>
              <h2>Mood</h2>
              <div id="autoChip">
                <button class="chip" id="auto" title="Wanders between moods on its own">auto</button>
              </div>
              <div id="grid"></div>
            </section>
            <section>
              <h2>Poke</h2>
              <div class="chips" id="reactions"></div>
            </section>
            <section>
              <h2>Colors</h2>
              <div class="crow"><span class="lbl">skin</span><span class="chips" id="skins"></span></div>
              <div class="crow"><span class="lbl">eyes</span><span class="chips" id="inks"></span></div>
              <label class="toggle"><input type="checkbox" id="pupils" /> pupils</label>
            </section>
            <section>
              <h2>Voice</h2>
              <div class="crow">
                <label class="toggle"><input type="checkbox" id="voiceOn" /> speak</label>
                <span class="lbl" style="width: auto">low</span>
                <input type="range" id="voicePitch" min="0.6" max="1.8" step="0.05" style="flex: 1" />
                <span class="lbl" style="width: auto">high</span>
              </div>
            </section>
            <section>
              <h2>Fits</h2>
              <div class="chips" id="presets"></div>
            </section>
            <section>
              <h2>Size</h2>
              <input type="range" id="size" min="80" max="800" step="4" />
            </section>
          </div>
          <div class="pane" id="pane-config" hidden>
            <section>
              <h2>Connection</h2>
              <div class="crow"><span class="lbl">server</span><input class="field-input" type="text" id="server" placeholder="wss://bwnd.app/api/v1/incubators/public/bbots/ws" spellcheck="false" /></div>
              <div class="crow"><span class="lbl">key</span><input class="field-input" type="password" id="token" placeholder="bbk_… (Tension → Settings → Desktop widgets)" spellcheck="false" /></div>
              <div class="crow" id="botRow" hidden><span class="lbl">bot</span><select id="bot"></select></div>
              <div class="conn-row">
                <label class="toggle"><input type="checkbox" id="auto-connect" /> connect on launch</label>
                <span style="flex: 1"></span>
                <button id="go">connect</button>
              </div>
              <div class="conn-row"><span id="connStatus"><b>offline</b> — chat is disabled until connected</span></div>
              <div class="conn-row hint">
                keys are minted at <a href="https://bwnd.app" target="_blank">bwnd.app</a>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script type="module">
      import { createFace, EXPRESSION_NAMES, REACTION_NAMES } from '../dist/face.js'

      const $ = (s) => document.querySelector(s)
      let cfg = await window.widget.getCfg()

      // --- tabs ---
      for (const tab of document.querySelectorAll('.tab[data-tab]')) {
        tab.addEventListener('click', () => {
          for (const t of document.querySelectorAll('.tab[data-tab]')) t.classList.toggle('active', t === tab)
          $('#pane-custom').hidden = tab.dataset.tab !== 'custom'
          $('#pane-config').hidden = tab.dataset.tab !== 'config'
        })
      }
      // outbound links open in the real browser via the window-open handler
      $('#lnkSite').addEventListener('click', () => window.open('https://bbot.bwnd.app'))
      $('#lnkRepo').addEventListener('click', () => window.open('https://github.com/bwndapp/bbot'))

      const luminance = (hex) => {
        const n = parseInt(hex.slice(1), 16)
        return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255
      }
      // Mini faces inherit these, so the whole gallery previews the outfit.
      function applyVars() {
        for (const el of [$('#grid'), $('#headFace')]) {
          el.style.setProperty('--face-skin', cfg.skin)
          el.style.setProperty('--face-ink', cfg.ink)
          el.style.setProperty(
            '--face-ring',
            luminance(cfg.skin) > 0.5 ? 'rgba(0,0,0,.3)' : '#3a3f44'
          )
        }
      }

      // --- header mascot: mirrors the widget's current mood ---
      let headFace
      const buildHead = () => {
        headFace?.destroy()
        headFace = createFace($('#headFace'), {
          expression: cfg.mood === 'auto' ? 'happy' : cfg.mood,
          pupils: cfg.pupils,
        })
      }

      // --- mood gallery: one live mini face per expression ---
      const cells = new Map()
      let minis = []
      function buildGrid() {
        for (const f of minis) f.destroy()
        minis = []
        $('#grid').replaceChildren()
        cells.clear()
        for (const name of EXPRESSION_NAMES) {
          const cell = document.createElement('button')
          cell.className = 'cell'
          cell.title = name
          const mini = document.createElement('div')
          mini.className = 'mini'
          const label = document.createElement('span')
          label.className = 'name'
          label.textContent = name
          cell.append(mini, label)
          // idle:false so each face holds its expression; track stays on, so
          // the whole gallery watches your cursor.
          minis.push(createFace(mini, { expression: name, idle: false, pupils: cfg.pupils }))
          cell.addEventListener('click', () => window.widget.setCfg({ mood: name }))
          $('#grid').appendChild(cell)
          cells.set(name, cell)
        }
      }

      function refreshSelection() {
        $('#auto').classList.toggle('selected', cfg.mood === 'auto')
        for (const [name, cell] of cells) cell.classList.toggle('selected', name === cfg.mood)
        for (const [row, key] of [
          ['#skins', 'skin'],
          ['#inks', 'ink'],
        ]) {
          for (const b of document.querySelectorAll(`${row} .swatch`))
            b.classList.toggle('selected', b.dataset.c === cfg[key])
        }
        $('#pupils').checked = cfg.pupils
      }

      $('#auto').addEventListener('click', () => window.widget.setCfg({ mood: 'auto' }))

      // --- reactions: poke the widget ---
      for (const name of REACTION_NAMES) {
        const b = document.createElement('button')
        b.className = 'chip'
        b.textContent = name
        b.addEventListener('click', () => window.widget.react(name))
        $('#reactions').appendChild(b)
      }

      // --- colors ---
      const SKINS = ['#16181a', '#f4f5f6', '#ffd166', '#ff6b6b', '#4ecdc4', '#a78bfa', '#b6ff3d', '#ff9ecb']
      const INKS = ['#e9ebec', '#101214', '#1f6feb', '#ff3d81', '#b6ff3d']
      function swatchRow(sel, colors, key) {
        const row = $(sel)
        for (const c of colors) {
          const b = document.createElement('button')
          b.className = 'swatch'
          b.dataset.c = c
          b.style.background = c
          b.addEventListener('click', () => window.widget.setCfg({ [key]: c }))
          row.appendChild(b)
        }
        const picker = document.createElement('input')
        picker.type = 'color'
        picker.value = cfg[key]
        picker.title = 'custom'
        picker.addEventListener('input', () => window.widget.setCfg({ [key]: picker.value }))
        row.appendChild(picker)
      }
      swatchRow('#skins', SKINS, 'skin')
      swatchRow('#inks', INKS, 'ink')

      $('#pupils').addEventListener('change', (e) => window.widget.setCfg({ pupils: e.target.checked }))

      // --- voice ---
      $('#voiceOn').checked = cfg.voice !== false
      $('#voicePitch').value = cfg.voicePitch || 1
      $('#voiceOn').addEventListener('change', (e) => window.widget.setCfg({ voice: e.target.checked }))
      $('#voicePitch').addEventListener('change', () => window.widget.setCfg({ voicePitch: +$('#voicePitch').value }))

      // --- presets ---
      const PRESETS = [
        ['midnight', { skin: '#16181a', ink: '#e9ebec' }],
        ['ghost', { skin: '#f4f5f6', ink: '#101214' }],
        ['terminal', { skin: '#0a0f0b', ink: '#b6ff3d' }],
        ['bubblegum', { skin: '#ff9ecb', ink: '#5f1d3a' }],
        ['ocean', { skin: '#4ecdc4', ink: '#0b3437' }],
      ]
      for (const [name, patch] of PRESETS) {
        const b = document.createElement('button')
        b.className = 'chip'
        b.textContent = name
        b.addEventListener('click', () => window.widget.setCfg(patch))
        $('#presets').appendChild(b)
      }

      // --- size ---
      const size = $('#size')
      size.value = await window.widget.getSize()
      size.addEventListener('input', () => window.widget.setSize(+size.value))

      // --- config: connection ---
      $('#server').value = cfg.server || ''
      $('#token').value = cfg.token || ''
      $('#auto-connect').checked = !!cfg.autoConnect
      $('#server').addEventListener('change', () => window.widget.setCfg({ server: $('#server').value.trim() }))
      $('#token').addEventListener('change', () => window.widget.setCfg({ token: $('#token').value.trim() }))
      $('#auto-connect').addEventListener('change', (e) => window.widget.setCfg({ autoConnect: e.target.checked }))

      let connStatus = 'off'
      let connUser = null
      function renderConn() {
        $('#tabDot').className = `tabdot ${connStatus}`
        $('#go').classList.toggle('on', connStatus === 'on' || connStatus === 'connecting')
        $('#go').textContent = connStatus === 'on' || connStatus === 'connecting' ? 'disconnect' : 'connect'
        $('#connStatus').innerHTML =
          connStatus === 'on'
            ? `<b>connected</b>${connUser?.email ? ' as ' + connUser.email : ''}`
            : connStatus === 'connecting'
              ? '<b>connecting…</b> retrying until it sticks'
              : connStatus === 'denied'
                ? '<b>key rejected</b> — revoke &amp; mint a new one in Tension'
                : '<b>offline</b> — chat is disabled until connected'
      }

      function renderBots(incubators) {
        const sel = $('#bot')
        $('#botRow').hidden = !incubators.length
        sel.replaceChildren()
        for (const inc of incubators) {
          const o = document.createElement('option')
          o.value = inc.id
          o.textContent = inc.name + (inc.container_running ? '' : ' (asleep)')
          sel.appendChild(o)
        }
        if (incubators.some((i) => i.id === cfg.incubator)) sel.value = cfg.incubator
      }
      $('#bot').addEventListener('change', () => window.widget.setCfg({ incubator: $('#bot').value }))

      $('#go').addEventListener('click', () => {
        // commit any un-blurred edits before connecting
        window.widget.setCfg({ server: $('#server').value.trim(), token: $('#token').value.trim() })
        if (connStatus === 'on' || connStatus === 'connecting') window.widget.bridgeDisconnect()
        else window.widget.bridgeConnect()
      })
      window.widget.onBridgeStatus((s) => ((connStatus = s), renderConn()))
      window.widget.onHello(({ user, incubators }) => {
        connUser = user
        renderBots(incubators)
        renderConn()
      })
      const hello = await window.widget.getHello()
      connStatus = hello.status
      connUser = hello.user
      renderBots(hello.incubators || [])
      renderConn()
      if (hello.status === 'on') window.widget.refreshBots() // roster may have changed

      // --- sync ---
      window.widget.onCfg((c) => {
        const rebuild = c.pupils !== cfg.pupils
        const moodChanged = c.mood !== cfg.mood
        cfg = c
        applyVars()
        if (rebuild) buildGrid()
        if (rebuild || moodChanged) buildHead()
        refreshSelection()
      })

      $('#x').addEventListener('click', () => window.close())
      addEventListener('keydown', (e) => e.key === 'Escape' && window.close())

      applyVars()
      buildGrid()
      buildHead()
      refreshSelection()
    </script>
  </body>
</html>
