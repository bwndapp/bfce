<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>homie chat</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px;
      }
      .bubble {
        max-width: 240px;
        padding: 8px 12px;
        border-radius: 16px;
        animation: pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: bottom center;
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .bubble.gone {
        transition: opacity 0.5s, transform 0.5s;
        opacity: 0;
        transform: translateY(-8px) scale(0.9);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.7);
        }
      }
      .homie {
        align-self: flex-start;
        background: var(--skin, #16181a);
        color: var(--ink, #e9ebec);
        border: 1px solid var(--ring, #2f3336);
        position: relative;
      }
      /* tail pointing down toward homie */
      .homie.tailed::after {
        content: '';
        position: absolute;
        left: 18px;
        bottom: -6px;
        width: 12px;
        height: 12px;
        background: inherit;
        border: inherit;
        border-top: none;
        border-left: none;
        transform: rotate(45deg);
      }
      .me {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.14);
        color: #eceff1;
        backdrop-filter: blur(6px);
      }
      .dots {
        display: inline-flex;
        gap: 4px;
        padding: 3px 0;
      }
      .dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink, #e9ebec);
        opacity: 0.5;
        animation: think 1.1s infinite;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.18s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes think {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      #row {
        width: 100%;
        box-sizing: border-box;
        padding: 2px 0 0;
      }
      #input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(16, 18, 20, 0.92);
        color: #eceff1;
        font: inherit;
        padding: 9px 15px;
        outline: none;
      }
      #input:focus {
        border-color: rgba(255, 255, 255, 0.35);
      }
      #input::placeholder {
        color: #6d757c;
      }
    </style>
  </head>
  <body>
    <div id="stack">
      <div id="row"><input id="input" placeholder="say something to homie…" maxlength="280" /></div>
    </div>

    <script type="module">
      const stack = document.querySelector('#stack')
      const row = document.querySelector('#row')
      const input = document.querySelector('#input')

      // bubbles wear homie's outfit
      let cfg = await window.widget.getCfg()
      const applyVars = () => {
        const lum = (h) => {
          const n = parseInt(h.slice(1), 16)
          return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255
        }
        stack.style.setProperty('--skin', cfg.skin)
        stack.style.setProperty('--ink', cfg.ink)
        stack.style.setProperty('--ring', lum(cfg.skin) > 0.5 ? 'rgba(0,0,0,.3)' : '#2f3336')
      }
      applyVars()
      window.widget.onCfg((c) => ((cfg = c), applyVars()))

      // window height follows content
      new ResizeObserver(() => window.widget.chatSize(stack.offsetHeight)).observe(stack)

      const MAX_BUBBLES = 4
      function addBubble(cls, text) {
        const b = document.createElement('div')
        b.className = `bubble ${cls}`
        b.textContent = text
        stack.insertBefore(b, row)
        // retail: only the newest homie bubble gets the tail
        for (const h of stack.querySelectorAll('.homie.tailed')) h.classList.remove('tailed')
        if (cls.includes('homie')) b.classList.add('tailed')
        const extra = stack.querySelectorAll('.bubble:not(.gone)').length - MAX_BUBBLES
        if (extra > 0) {
          for (const old of [...stack.querySelectorAll('.bubble:not(.gone)')].slice(0, extra)) {
            old.classList.add('gone')
            setTimeout(() => old.remove(), 550)
          }
        }
        return b
      }

      let typing = null
      function showTyping() {
        typing = addBubble('homie tailed', '')
        const d = document.createElement('span')
        d.className = 'dots'
        d.innerHTML = '<i></i><i></i><i></i>'
        typing.appendChild(d)
      }

      function typewrite(el, text) {
        el.textContent = ''
        let i = 0
        const tick = () => {
          el.textContent = text.slice(0, ++i)
          if (i < text.length) setTimeout(tick, 18 + Math.random() * 30)
        }
        tick()
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') return window.widget.closeChat()
        if (e.key !== 'Enter') return
        const text = input.value.trim()
        if (!text) return
        input.value = ''
        addBubble('me', text)
        showTyping()
        window.widget.chatSend(text)
      })

      window.widget.onChatReply(({ text }) => {
        if (typing) {
          typing.remove()
          typing = null
        }
        const b = addBubble('homie tailed', '')
        typewrite(b, text)
        input.focus()
      })

      window.widget.onChatFocus(() => input.focus())
      input.focus()
    </script>
  </body>
</html>
