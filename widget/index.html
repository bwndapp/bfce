<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>bbot widget</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
        /* palette lives here so the peep bubble can wear it too */
        --face-skin: #16181a;
        --face-ink: #e9ebec;
        --face-ring: #2f3336;
      }
      /* Inset so reactions (shake, boing, …) can overshoot without
         clipping at the window edge. */
      #face {
        position: absolute;
        inset: 10%;
        /* clickable (click = chat, press-and-move = drag), so no OS drag region */
        -webkit-app-region: no-drag;
        cursor: grab;
      }
      #face:active {
        cursor: grabbing;
      }
      .ctl {
        position: absolute;
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 50%;
        background: #16181a;
        color: #9aa0a6;
        font: 12px/1 sans-serif;
        padding: 0;
        opacity: 0;
        transition: opacity 0.15s;
        -webkit-app-region: no-drag;
        z-index: 2;
      }
      body.hovered .ctl {
        opacity: 0.6;
      }
      body.hovered .ctl:hover {
        opacity: 1;
        color: #fff;
      }
      #scale {
        top: 4px;
        left: 4px;
        cursor: nwse-resize;
      }
      #close {
        top: 4px;
        right: 4px;
        cursor: pointer;
      }
      #edit {
        bottom: 4px;
        left: 4px;
        cursor: pointer;
      }
      #talk {
        bottom: 4px;
        right: 4px;
        cursor: pointer;
      }
      /* unread notification: a big anime "!" right off the head */
      #peep {
        position: absolute;
        top: 0;
        right: 7%;
        font: 900 26vmin/0.9 system-ui, sans-serif;
        color: var(--face-ink);
        -webkit-text-stroke: 2vmin var(--face-skin);
        paint-order: stroke fill;
        transform: rotate(12deg);
        z-index: 3;
        pointer-events: none;
        animation:
          peekin 0.35s cubic-bezier(0.34, 1.8, 0.64, 1),
          bob 1.6s 0.35s ease-in-out infinite;
      }
      @keyframes peekin {
        from {
          opacity: 0;
          transform: rotate(12deg) scale(0.2) translateY(30%);
        }
      }
      @keyframes bob {
        50% {
          transform: rotate(12deg) translateY(-4%) scale(1.06);
        }
      }
      #peep[hidden] {
        display: none;
      }
      /* pending reply: a thought forming — bubbles pop in one after another,
         hold together, shrink away, repeat */
      #think {
        position: absolute;
        top: 3%;
        left: 9%;
        width: 19vmin;
        height: 19vmin;
        z-index: 3;
        pointer-events: none;
      }
      #think i {
        position: absolute;
        border-radius: 50%;
        background: var(--face-ink);
        border: 0.9vmin solid var(--face-skin);
        opacity: 0;
        animation: tcycle 2.2s ease-in-out infinite;
      }
      #think i:nth-child(1) {
        width: 3vmin;
        height: 3vmin;
        bottom: 0;
        right: 0;
      }
      #think i:nth-child(2) {
        width: 4.5vmin;
        height: 4.5vmin;
        bottom: 4.2vmin;
        right: 4.2vmin;
        animation-delay: 0.22s;
      }
      #think i:nth-child(3) {
        width: 7.5vmin;
        height: 7.5vmin;
        bottom: 9.5vmin;
        right: 9.5vmin;
        animation-delay: 0.44s;
      }
      @keyframes tcycle {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        12% {
          transform: scale(1.18);
          opacity: 1;
        }
        20% {
          transform: scale(1);
        }
        70% {
          transform: scale(1);
          opacity: 1;
        }
        84%,
        100% {
          transform: scale(0.5);
          opacity: 0;
        }
      }
      #think[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="face"></div>
    <button id="scale" class="ctl" title="Drag to resize">⤡</button>
    <button id="close" class="ctl" title="Close">✕</button>
    <button id="edit" class="ctl" title="Customize">✎</button>
    <button id="talk" class="ctl" title="Chat">…</button>
    <div id="peep" hidden>!</div>
    <div id="think" hidden><i></i><i></i><i></i></div>

    <script type="module">
      import { createFace } from '../dist/face.js'

      const faceEl = document.querySelector('#face')

      // --- config lives in the main process; both windows subscribe ---
      let cfg = await window.widget.getCfg()

      const luminance = (hex) => {
        const n = parseInt(hex.slice(1), 16)
        return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255
      }
      function applyColors() {
        // set on body: the face inherits, and so does the peep bubble
        document.body.style.setProperty('--face-skin', cfg.skin)
        document.body.style.setProperty('--face-ink', cfg.ink)
        // Keep the hairline visible on both light and dark skins.
        document.body.style.setProperty(
          '--face-ring',
          luminance(cfg.skin) > 0.5 ? 'rgba(0,0,0,.3)' : '#2f3336'
        )
      }

      // --- the face (rebuilt when pupils change; that option is creation-time) ---
      const activeMood = () => (cfg.mood === 'auto' ? mood : cfg.mood)
      let face
      function buildFace() {
        face?.destroy()
        face = createFace(faceEl, {
          expression: activeMood(),
          track: false,
          pupils: cfg.pupils,
        })
      }

      window.widget.onCfg((c) => {
        const rebuild = c.pupils !== cfg.pupils
        cfg = c
        applyColors()
        if (rebuild) buildFace()
        else face.setExpression(activeMood())
      })
      window.widget.onReact((name) => face.react(name))

      document.querySelector('#edit').addEventListener('click', () => window.widget.toggleSettings())
      document.querySelector('#talk').addEventListener('click', () => window.widget.toggleChat())

      // --- the face itself: click to chat, press-and-move to drag ---
      let pressing = null
      faceEl.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return
        faceEl.setPointerCapture(e.pointerId)
        pressing = { x: e.screenX, y: e.screenY, moved: false }
      })
      faceEl.addEventListener('pointermove', (e) => {
        if (!pressing || pressing.moved) return
        if (Math.hypot(e.screenX - pressing.x, e.screenY - pressing.y) > 4) {
          pressing.moved = true
          window.widget.moveStart()
        }
      })
      faceEl.addEventListener('pointerup', () => {
        if (!pressing) return
        if (pressing.moved) window.widget.moveEnd()
        else window.widget.toggleChat()
        pressing = null
      })
      faceEl.addEventListener('lostpointercapture', () => {
        if (pressing?.moved) window.widget.moveEnd()
        pressing = null
      })

      // --- chat choreography: the face acts out the conversation ---
      let chatTimer
      let chatting = false
      const think = document.querySelector('#think')
      window.widget.onChatState(({ state, mood: replyMood, react }) => {
        clearTimeout(chatTimer)
        chatting = state !== 'end'
        think.hidden = state !== 'thinking' && state !== 'tool'
        if (state === 'open') {
          face.setExpression('curious')
          face.react('pop')
          face.look(0, -0.6, 900) // glance up at the bubble window
        } else if (state === 'thinking') {
          face.setExpression('thinking')
          face.look(-0.4, -0.7, 2500)
        } else if (state === 'streaming') {
          // words are landing — look at the bubbles and talk
          face.setExpression('content')
          face.look(0, -0.6, 1200)
        } else if (state === 'tool') {
          face.setExpression('focus')
        } else if (state === 'error') {
          face.setExpression('worried')
          face.react('shake')
          chatTimer = setTimeout(() => face.setExpression(activeMood()), 5000)
        } else if (state === 'reply') {
          face.setExpression(replyMood || 'content')
          if (react) face.react(react)
          // drift back to his own mood once the moment passes
          chatTimer = setTimeout(() => face.setExpression(activeMood()), 7000)
        } else if (state === 'end') {
          face.setExpression(activeMood())
        }
      })
      document.querySelector('#close').addEventListener('click', () => window.widget.quit())
      addEventListener('keydown', (e) => e.key === 'Escape' && window.widget.quit())

      // --- scale handle: main process sizes the window to follow the cursor ---
      const scale = document.querySelector('#scale')
      scale.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        scale.setPointerCapture(e.pointerId)
        window.widget.resizeStart()
      })
      scale.addEventListener('pointerup', () => window.widget.resizeEnd())
      scale.addEventListener('lostpointercapture', () => window.widget.resizeEnd())

      // --- eyes follow the cursor anywhere on the desktop ---
      const REACH = 500 // px from face centre for full eye deflection
      let last = null
      window.widget.onCursor(({ x, y }) => {
        // x/y are relative to the window centre, so this doubles as a
        // hover test that works over the drag region.
        const inside = Math.abs(x) < innerWidth / 2 && Math.abs(y) < innerHeight / 2
        document.body.classList.toggle('hovered', inside)
        if (dragging) return
        const moved = !last || Math.abs(x - last.x) > 2 || Math.abs(y - last.y) > 2
        last = { x, y }
        // Only steer while the cursor is moving; when look() expires the
        // face's own idle wander takes back over.
        if (moved) {
          const clamp = (v) => Math.max(-1, Math.min(1, v / REACH))
          face.look(clamp(x), clamp(y), 1500)
        }
      })

      // --- personality ---
      const MOODS = [
        'idle', 'content', 'happy', 'curious', 'thinking', 'smug',
        'bored', 'sleepy', 'joy', 'suspicious', 'unimpressed', 'relieved',
      ]
      let mood = 'idle'
      function wander() {
        if (cfg.mood === 'auto' && !chatting) {
          mood = MOODS[Math.floor(Math.random() * MOODS.length)]
          face.setExpression(mood)
          if (Math.random() < 0.25) face.react(Math.random() < 0.5 ? 'wink' : 'bounce')
        }
        setTimeout(wander, 8000 + Math.random() * 14000)
      }
      setTimeout(wander, 6000)

      // --- the voice: animalese-ish gibberish shaped by the real text.
      // Each letter is a pitched blip (vowels ring high and long, consonants
      // tick low and short, same letter always sounds the same), punctuation
      // phrases it, and '?' lilts upward. It voices the token stream itself,
      // so speech lasts exactly as long as the reply is arriving.
      let vctx = null
      let vt = 0
      function blipNote(freq, t, dur, peak = 0.07) {
        // soft sine chirp that bends upward — reads as chirpy, not buzzy
        const o = vctx.createOscillator()
        const g = vctx.createGain()
        o.type = 'sine'
        o.frequency.setValueAtTime(freq * 0.82, t)
        o.frequency.exponentialRampToValueAtTime(freq * 1.06, t + dur)
        g.gain.setValueAtTime(0, t)
        g.gain.linearRampToValueAtTime(peak, t + 0.007)
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
        o.connect(g).connect(vctx.destination)
        o.start(t)
        o.stop(t + dur + 0.03)
      }
      window.widget.onSpeak(({ text }) => {
        if (cfg.voice === false) return
        try {
          vctx ??= new AudioContext()
        } catch {
          return
        }
        const now = vctx.currentTime
        if (vt < now + 0.03) vt = now + 0.03
        const pitch = cfg.voicePitch || 1
        for (const ch of String(text).toLowerCase()) {
          if (vt > now + 5) return // stay roughly in step with the stream
          if (/[a-z0-9]/.test(ch)) {
            const vowel = 'aeiou'.includes(ch)
            const seed = ((ch.charCodeAt(0) * 7919) % 97) / 97
            const f = 340 * pitch * (vowel ? 1.55 + seed * 0.95 : 1.1 + seed * 0.6)
            const dur = vowel ? 0.048 : 0.032
            blipNote(f, vt, dur)
            vt += dur * 0.8
          } else if (ch === ' ') vt += 0.028
          else if (',;:'.includes(ch)) vt += 0.09
          else if (ch === '?') {
            blipNote(560 * pitch, vt, 0.06)
            blipNote(790 * pitch, vt + 0.055, 0.09)
            vt += 0.19
          } else if ('.!'.includes(ch)) vt += 0.15
        }
      })

      // --- a bot reached out: peep bubble up and perk up ---
      const peep = document.querySelector('#peep')
      let peepTimer = null

      // a cute two-note blip, synthesized so there's no asset to ship
      let audioCtx = null
      function blip() {
        try {
          audioCtx ??= new AudioContext()
          const t0 = audioCtx.currentTime
          const note = (freq, start, dur, peak = 0.15) => {
            const o = audioCtx.createOscillator()
            const g = audioCtx.createGain()
            o.type = 'sine'
            o.frequency.setValueAtTime(freq, t0 + start)
            g.gain.setValueAtTime(0, t0 + start)
            g.gain.linearRampToValueAtTime(peak, t0 + start + 0.012)
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur)
            o.connect(g).connect(audioCtx.destination)
            o.start(t0 + start)
            o.stop(t0 + start + dur + 0.05)
          }
          note(784, 0, 0.09) // G5…
          note(1175, 0.07, 0.16) // …up to D6: "bli-bloop"
        } catch {}
      }

      window.widget.onNotify(() => {
        peep.hidden = false
        blip()
        if (!chatting) {
          clearTimeout(chatTimer)
          face.setExpression('excited')
          face.react('pop')
          face.react('bounce')
          chatTimer = setTimeout(() => face.setExpression(activeMood()), 4000)
        }
        // a soft nudge now and then until it's read
        clearInterval(peepTimer)
        peepTimer = setInterval(() => !chatting && face.react('bounce'), 15000)
      })
      window.widget.onNotifyClear(() => {
        peep.hidden = true
        clearInterval(peepTimer)
      })

      // --- being dragged around ---
      let dragging = false
      let dropTimer
      window.widget.onDragging(() => {
        if (!dragging) {
          dragging = true
          face.setExpression('scared')
        }
        clearTimeout(dropTimer)
        dropTimer = setTimeout(() => {
          dragging = false
          face.react('boing')
          face.setExpression(activeMood())
        }, 250)
      })

      applyColors()
      buildFace()
    </script>
  </body>
</html>
