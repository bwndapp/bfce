<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>bbot widget</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
        /* palette lives here so the peep bubble can wear it too */
        --face-skin: #16181a;
        --face-ink: #e9ebec;
        --face-ring: #2f3336;
      }
      /* Inset so reactions (shake, boing, …) can overshoot without
         clipping at the window edge. */
      #face {
        position: absolute;
        inset: 10%;
        z-index: 1;
        /* clickable (click = chat, press-and-move = drag), so no OS drag region */
        -webkit-app-region: no-drag;
        cursor: grab;
      }
      /* the pool of shadow that grounds him on the desktop */
      #ground {
        position: absolute;
        left: 50%;
        bottom: 1.5%;
        width: 66%;
        height: 8%;
        transform: translateX(-50%);
        background: radial-gradient(
          closest-side,
          rgba(0, 0, 0, 0.55),
          rgba(0, 0, 0, 0.25) 55%,
          rgba(0, 0, 0, 0)
        );
        pointer-events: none;
        z-index: 0;
      }
      #face:active {
        cursor: grabbing;
      }
      .ctl {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 50%;
        background: #16181a;
        color: #9aa0a6;
        font: 12px/1 sans-serif;
        padding: 0;
        opacity: 0;
        transition: opacity 0.15s;
        -webkit-app-region: no-drag;
        z-index: 2;
      }
      body.hovered .ctl {
        opacity: 0.6;
      }
      body.hovered .ctl:hover {
        opacity: 1;
        color: #fff;
      }
      #scale {
        top: 4px;
        left: 4px;
        cursor: nwse-resize;
      }
      #close {
        top: 4px;
        right: 4px;
        cursor: pointer;
      }
      #edit {
        bottom: 4px;
        left: 4px;
        cursor: pointer;
      }
      #talk {
        bottom: 4px;
        right: 4px;
        cursor: pointer;
      }
      /* unread notification: a big anime "!" right off the head */
      #peep {
        position: absolute;
        top: 0;
        right: 7%;
        font: 900 26vmin/0.9 system-ui, sans-serif;
        color: var(--face-ink);
        -webkit-text-stroke: 2vmin var(--face-skin);
        paint-order: stroke fill;
        transform: rotate(12deg);
        z-index: 3;
        pointer-events: none;
        animation:
          peekin 0.35s cubic-bezier(0.34, 1.8, 0.64, 1),
          bob 1.6s 0.35s ease-in-out infinite;
      }
      @keyframes peekin {
        from {
          opacity: 0;
          transform: rotate(12deg) scale(0.2) translateY(30%);
        }
      }
      @keyframes bob {
        50% {
          transform: rotate(12deg) translateY(-4%) scale(1.06);
        }
      }
      #peep[hidden] {
        display: none;
      }
      /* pending reply: a halo ringing the crown — a comet arc with fading
         trail sweeps the ellipse; the whole ring floats and sways */
      #think {
        position: absolute;
        top: 1.5vmin;
        left: 50%;
        width: 42vmin;
        transform: translateX(-50%) rotate(-8deg);
        z-index: 3;
        pointer-events: none;
        animation:
          halopop 0.35s cubic-bezier(0.34, 1.8, 0.64, 1),
          halofloat 4.5s 0.35s ease-in-out infinite;
      }
      #think svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      #think ellipse {
        fill: none;
        stroke: #a6adb4; /* neutral gray — never fights the outfit */
        stroke-linecap: round;
      }
      #think .track {
        opacity: 0.16;
        stroke-width: 5;
      }
      #think .arc,
      #think .tail1,
      #think .tail2 {
        animation: halospin 1s linear infinite;
      }
      #think .arc {
        stroke-width: 6.5;
        stroke-dasharray: 38 142;
        filter: drop-shadow(0 0 1vmin rgba(166, 173, 180, 0.7));
      }
      #think .tail1 {
        stroke-width: 5;
        stroke-dasharray: 24 156;
        opacity: 0.4;
        animation-delay: -0.94s;
      }
      #think .tail2 {
        stroke-width: 3.6;
        stroke-dasharray: 12 168;
        opacity: 0.18;
        animation-delay: -0.88s;
      }
      @keyframes halospin {
        to {
          stroke-dashoffset: -180;
        }
      }
      @keyframes halopop {
        from {
          opacity: 0;
          transform: translateX(-50%) rotate(-8deg) scale(0.4);
        }
      }
      @keyframes halofloat {
        0%,
        100% {
          transform: translateX(-50%) rotate(-8deg);
        }
        50% {
          transform: translateX(-50%) translateY(-1.3vmin) rotate(-2deg);
        }
      }
      #think[hidden] {
        display: none;
      }
      /* aura particles twinkle (orbiting is SMIL, anchored at the centre) */
      .bwa-tw {
        animation: auratw 2.6s ease-in-out infinite;
      }
      @keyframes auratw {
        0%,
        100% {
          opacity: 0.15;
        }
        50% {
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="ground"></div>
    <div id="face"></div>
    <button id="scale" class="ctl" title="Drag to resize">⤡</button>
    <button id="close" class="ctl" title="Close">✕</button>
    <button id="edit" class="ctl" title="Customize">✎</button>
    <button id="talk" class="ctl" title="Chat">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M3 2h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8.4l-3 2.5c-.4.35-1 .06-1-.46V12H3a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
      </svg>
    </button>
    <div id="peep" hidden>!</div>
    <div id="think" hidden>
      <svg viewBox="0 0 100 40" aria-hidden="true">
        <ellipse class="track" cx="50" cy="20" rx="44" ry="14" />
        <ellipse class="tail2" cx="50" cy="20" rx="44" ry="14" />
        <ellipse class="tail1" cx="50" cy="20" rx="44" ry="14" />
        <ellipse class="arc" cx="50" cy="20" rx="44" ry="14" />
      </svg>
    </div>

    <script type="module">
      import { createFace } from '../dist/face.js'

      const faceEl = document.querySelector('#face')

      // --- config lives in the main process; both windows subscribe ---
      let cfg = await window.widget.getCfg()

      const luminance = (hex) => {
        const n = parseInt(hex.slice(1), 16)
        return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255
      }
      // the aura glows in a colour derived from the body: dark skins get a
      // brighter, more saturated self; light skins a deeper one
      function auraColor(hex) {
        const n = parseInt(hex.slice(1), 16)
        let r = ((n >> 16) & 255) / 255
        let g = ((n >> 8) & 255) / 255
        let b = (n & 255) / 255
        const max = Math.max(r, g, b)
        const min = Math.min(r, g, b)
        let h = 0
        const l = (max + min) / 2
        const d = max - min
        let s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1))
        if (d > 0) {
          if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60
          else if (max === g) h = ((b - r) / d + 2) * 60
          else h = ((r - g) / d + 4) * 60
        }
        s = Math.min(1, Math.max(s, 0.3) + 0.15)
        const nl = l < 0.5 ? Math.min(0.72, l + 0.32) : Math.max(0.28, l - 0.28)
        return `hsl(${h.toFixed(0)} ${(s * 100).toFixed(0)}% ${(nl * 100).toFixed(0)}%)`
      }

      function applyColors() {
        // set on body: the face inherits, and so does the peep bubble
        document.body.style.setProperty('--face-skin', cfg.skin)
        document.body.style.setProperty('--face-ink', cfg.ink)
        document.body.style.setProperty('--aura-color', auraColor(cfg.skin))
        // Keep the hairline visible on both light and dark skins.
        document.body.style.setProperty(
          '--face-ring',
          luminance(cfg.skin) > 0.5 ? 'rgba(0,0,0,.3)' : '#2f3336'
        )
      }

      // --- the face (rebuilt when pupils change; that option is creation-time) ---
      const activeMood = () => (cfg.mood === 'auto' ? mood : cfg.mood)
      let sleeping = false // system idle > 5 min
      const restMood = () => (sleeping ? 'sleep' : activeMood())
      let face
      function buildFace() {
        face?.destroy()
        face = createFace(faceEl, {
          expression: activeMood(),
          track: false,
          pupils: cfg.pupils,
        })
        renderLighting()
        renderMouth()
        renderAura()
        if (!extrasRaf) extrasRaf = requestAnimationFrame(extrasFrame)
      }

      // --- the talking mouth: ours, not the library's. Purpose-built for
      // speech, visible only while speaking, and projected onto the same
      // sphere the eyes ride (yaw/pitch recovered from their midpoint).
      let mouthG = null
      let mouthPath = null
      let eyeEls = []
      let mBaseY = -3
      let mOpen = 0
      let mVis = 0
      function renderMouth() {
        const svgEl = faceEl.querySelector('svg')
        const headGroup = svgEl?.getElementsByTagName('g')[0]
        if (!headGroup) return
        headGroup.querySelector(':scope > .bwm')?.remove()
        mouthG = document.createElementNS('http://www.w3.org/2000/svg', 'g')
        mouthG.setAttribute('class', 'bwm')
        mouthG.setAttribute('opacity', '0')
        mouthG.style.pointerEvents = 'none'
        mouthPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        mouthPath.style.fill = 'var(--face-ink)'
        mouthG.appendChild(mouthPath)
        headGroup.appendChild(mouthG)
        eyeEls = [...faceEl.querySelectorAll('.bwf-eye-group')]
        mOpen = 0
        mVis = 0
      }
      function updateMouth(level) {
        if (!mouthG || !mouthG.isConnected) return
        // fast attack, slower release: syllable flap without flicker
        const target = level * 0.9
        mOpen += (target - mOpen) * (target > mOpen ? 0.5 : 0.22)
        const want = level > 0.03 || mOpen > 0.05 ? 1 : 0
        mVis += (want - mVis) * (want > mVis ? 0.28 : 0.1)
        mouthG.setAttribute('opacity', mVis.toFixed(3))
        if (mVis < 0.02) return
        // four shapes, blended by the sound itself: bright audio pulls WIDE
        // (corners out, shallow — "ee"), dark audio pulls ROUND (small "o"),
        // loud mids drop the jaw OPEN ("ah"), silence closes it
        const wide = Math.min(1, Math.max(0, (mHiS - 0.16) * 3.2))
        const round = Math.min(1, Math.max(0, (mLoS - 0.48) * 2.6))
        const w = (11.5 - mOpen * 3.2) * (1 + wide * 0.35 - round * 0.42)
        const d = (1.6 + mOpen * 15) * (1 - wide * 0.45 + round * 0.12)
        const tc = 1.6 - wide * 1.1
        mouthPath.setAttribute(
          'd',
          `M ${-w.toFixed(2)} 0 Q 0 ${tc.toFixed(2)} ${w.toFixed(2)} 0` +
            ` Q ${w.toFixed(2)} ${d.toFixed(2)} 0 ${d.toFixed(2)}` +
            ` Q ${-w.toFixed(2)} ${d.toFixed(2)} ${-w.toFixed(2)} 0 Z`
        )
        if (eyeEls.length === 2 && eyeEls[0].isConnected) {
          const l = TR.exec(eyeEls[0].getAttribute('transform') || '')
          const r = TR.exec(eyeEls[1].getAttribute('transform') || '')
          if (l && r) {
            const midX = (+l[1] + +r[1]) / 2
            const midY = (+l[2] + +r[2]) / 2
            mBaseY += (midY - mBaseY) * 0.012
            const sinYaw = Math.max(-0.9, Math.min(0.9, midX / 41))
            const cosYaw = Math.sqrt(1 - sinYaw * sinYaw)
            const sinPitch = Math.max(-0.9, Math.min(0.9, -(midY - mBaseY) / (41 * cosYaw)))
            const cosPitch = Math.sqrt(1 - sinPitch * sinPitch)
            // the library's project() for the mouth anchor (0, 20), r = 46
            const pz = Math.sqrt(46 * 46 - 20 * 20)
            const x1 = pz * sinYaw
            const z1 = pz * cosYaw
            const y = 20 * cosPitch - z1 * sinPitch
            const z2 = 20 * sinPitch + z1 * cosPitch
            const squash = Math.max(0.25, Math.min(1, z2 / pz))
            const phi = ((Math.atan2(y, x1) * 180) / Math.PI).toFixed(1)
            mouthG.setAttribute(
              'transform',
              `translate(${x1.toFixed(2)} ${y.toFixed(2)}) rotate(${phi}) scale(${squash.toFixed(3)} 1) rotate(${-phi})`
            )
          }
        }
      }

      // --- aura: glow, drifting ring, or orbiting particles, in ink ---
      function renderAura() {
        const svgEl = faceEl.querySelector('svg')
        const headGroup = svgEl?.getElementsByTagName('g')[0]
        if (!headGroup) return
        svgEl.style.overflow = 'visible'
        headGroup.querySelector(':scope > .bwa')?.remove()
        if (!cfg.aura || cfg.aura === 'none') return
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
        g.setAttribute('class', 'bwa')
        g.style.fill = 'var(--aura-color)'
        g.style.stroke = 'var(--aura-color)'
        g.style.pointerEvents = 'none'
        if (cfg.aura === 'glow') {
          g.innerHTML =
            '<circle r="46" fill="none" stroke-width="7" opacity="0.3" style="filter: blur(3px)"/>'
        } else if (cfg.aura === 'ring') {
          // SMIL rotate about (0,0): orbits the face centre no matter what
          // transforms the head group carries
          g.innerHTML =
            '<g><circle r="53" fill="none" stroke-width="2.2" stroke-dasharray="6 7" opacity="0.55"/>' +
            '<animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="26s" repeatCount="indefinite"/></g>'
        } else if (cfg.aura === 'particles') {
          // an emitter, not an orbit: each mote is born at the rim, drifts
          // out and up like an ember, fades through its lifetime, respawns.
          // Varied lifespans and staggered phases keep the loop invisible.
          let s = ''
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2 + (i % 3) * 0.35
            const r0 = 47 + (i % 3) * 2
            const x0 = (r0 * Math.cos(a)).toFixed(1)
            const y0 = (r0 * Math.sin(a)).toFixed(1)
            const drift = 9 + (i % 4) * 3
            const dx = (Math.cos(a) * drift).toFixed(1)
            const dy = (Math.sin(a) * drift - 5).toFixed(1) // embers rise
            const size = (1.1 + (i % 3) * 0.5).toFixed(2)
            const dur = (2.6 + (i % 5) * 0.55).toFixed(2)
            const begin = (-((i * 0.7) % 4)).toFixed(2)
            s +=
              `<g><circle cx="${x0}" cy="${y0}" r="${size}" stroke="none" opacity="0">` +
              `<animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.3;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>` +
              `</circle>` +
              `<animateTransform attributeName="transform" type="translate" from="0 0" to="${dx} ${dy}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></g>`
          }
          g.innerHTML = s
        }
        headGroup.appendChild(g)
      }

      // --- lighting: a shaded sphere, a cursor-chasing glint, and a ground
      // shadow that reacts to how high he's bouncing ---
      const ground = document.querySelector('#ground')
      let headGroupEl = null
      let extrasRaf = null // the scene frame loop's rAF handle
      function renderLighting() {
        const svgEl = faceEl.querySelector('svg')
        const defs = svgEl?.querySelector('defs')
        headGroupEl = svgEl?.getElementsByTagName('g')[0] || null
        if (!svgEl || !defs || !headGroupEl) return
        defs.insertAdjacentHTML(
          'beforeend',
          '<radialGradient id="bwl-shade" cx="36%" cy="30%" r="88%">' +
            '<stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>' +
            '<stop offset="45%" stop-color="#fff" stop-opacity="0"/>' +
            '<stop offset="80%" stop-color="#000" stop-opacity="0"/>' +
            '<stop offset="100%" stop-color="#000" stop-opacity="0.28"/>' +
            '</radialGradient>'
        )
        const shade = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
        shade.setAttribute('class', 'bwl')
        shade.setAttribute('r', '46')
        shade.setAttribute('fill', 'url(#bwl-shade)')
        shade.style.pointerEvents = 'none'
        // between the head disc and the features: shades the ball, not the eyes
        headGroupEl.insertBefore(shade, headGroupEl.children[2] || null)
      }

      const TR = /translate\((-?[\d.]+)[ ,](-?[\d.]+)\)/
      function extrasFrame() {
        if (!headGroupEl || !headGroupEl.isConnected) {
          extrasRaf = null
          return
        }
        extrasRaf = requestAnimationFrame(extrasFrame)

        // lighting dynamics: the ground shadow reacts to how high he is
        const hm = TR.exec(headGroupEl.getAttribute('transform') || '')
        const htx = hm ? +hm[1] : 0
        const lift = Math.max(0, hm ? -+hm[2] : 0) // viewBox units off the ground
        ground.style.transform = `translateX(calc(-50% + ${(htx * 0.6).toFixed(1)}vmin)) scaleX(${Math.max(0.55, 1 - lift / 55).toFixed(3)})`
        ground.style.opacity = Math.max(0.25, 1 - lift / 30).toFixed(2)

        // lip-sync: live loudness drives the head jiggle and our talking mouth
        let level = 0
        if (analyser) {
          analyser.getByteTimeDomainData(analyserData)
          let sum = 0
          for (let i = 0; i < analyserData.length; i++) {
            const d = (analyserData[i] - 128) / 128
            sum += d * d
          }
          const rms = Math.sqrt(sum / analyserData.length)
          // noise gate, then a gentler curve: conversation sits mid-range,
          // only genuinely loud syllables hit full open
          level = rms < 0.015 ? 0 : Math.min(1, Math.pow(rms * 5, 1.1))
          // spectral colour → mouth shape: treble share reads as "ee",
          // bass share as "oo" (bins are ~94Hz wide at 48kHz)
          if (level > 0) {
            analyser.getByteFrequencyData(analyserFreq)
            let lo = 0
            let mid = 0
            let hi = 0
            for (let i = 1; i < 8; i++) lo += analyserFreq[i] // ~100-750Hz
            for (let i = 8; i < 20; i++) mid += analyserFreq[i] // ~750-1900Hz
            for (let i = 20; i < 44; i++) hi += analyserFreq[i] // ~1.9-4.1kHz
            const total = lo + mid + hi || 1
            mHiS += (hi / total - mHiS) * 0.35
            mLoS += (lo / total - mLoS) * 0.35
          }
        }
        face?.talk?.(level)
        updateMouth(level)

      }

      window.widget.onCfg((c) => {
        activity()
        const rebuild = c.pupils !== cfg.pupils || c.voiceMode !== cfg.voiceMode
        cfg = c
        applyColors()
        if (rebuild) buildFace()
        else {
          renderAura()
          face.setExpression(restMood())
        }
      })
      window.widget.onReact((name) => (activity(), face.react(name)))

      document.querySelector('#edit').addEventListener('click', () => window.widget.toggleSettings())
      document.querySelector('#talk').addEventListener('click', () => window.widget.toggleChat())

      // --- the face itself: click to chat, press-and-move to drag ---
      let pressing = null
      faceEl.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return
        activity()
        faceEl.setPointerCapture(e.pointerId)
        pressing = { x: e.screenX, y: e.screenY, moved: false }
      })
      faceEl.addEventListener('pointermove', (e) => {
        if (!pressing || pressing.moved) return
        if (Math.hypot(e.screenX - pressing.x, e.screenY - pressing.y) > 4) {
          pressing.moved = true
          window.widget.moveStart()
        }
      })
      faceEl.addEventListener('pointerup', () => {
        if (!pressing) return
        if (pressing.moved) window.widget.moveEnd()
        else {
          window.widget.voiceStop() // clicking him always shuts him up
          window.widget.toggleChat()
        }
        pressing = null
      })
      faceEl.addEventListener('lostpointercapture', () => {
        if (pressing?.moved) window.widget.moveEnd()
        pressing = null
      })
      // right-click: clone / chat / customize / dismiss
      addEventListener('contextmenu', (e) => {
        e.preventDefault()
        window.widget.faceMenu()
      })

      // --- chat choreography: the face acts out the conversation ---
      let chatTimer
      let chatting = false
      const think = document.querySelector('#think')
      window.widget.onChatState(({ state, mood: replyMood, react }) => {
        activity()
        clearTimeout(chatTimer)
        chatting = state !== 'end'
        think.hidden = state !== 'thinking' && state !== 'tool'
        if (state === 'open') {
          face.setExpression('curious')
          face.react('pop')
          face.look(0, -0.6, 900) // glance up at the bubble window
        } else if (state === 'thinking') {
          face.setExpression('thinking')
          face.look(-0.4, -0.7, 2500)
        } else if (state === 'streaming') {
          // words are landing — look at the bubbles and talk
          face.setExpression('content')
          face.look(0, -0.6, 1200)
        } else if (state === 'tool') {
          face.setExpression('focus')
        } else if (state === 'error') {
          face.setExpression('worried')
          face.react('shake')
          chatTimer = setTimeout(() => face.setExpression(restMood()), 5000)
        } else if (state === 'reply') {
          face.setExpression(replyMood || 'content')
          if (react) face.react(react)
          // drift back to his own mood once the moment passes
          chatTimer = setTimeout(() => face.setExpression(restMood()), 7000)
        } else if (state === 'end') {
          face.setExpression(restMood())
        }
      })
      document.querySelector('#close').addEventListener('click', () => window.widget.quit())
      addEventListener('keydown', (e) => e.key === 'Escape' && window.widget.quit())

      // --- scale handle: main process sizes the window to follow the cursor ---
      const scale = document.querySelector('#scale')
      scale.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        scale.setPointerCapture(e.pointerId)
        window.widget.resizeStart()
      })
      scale.addEventListener('pointerup', () => window.widget.resizeEnd())
      scale.addEventListener('lostpointercapture', () => window.widget.resizeEnd())

      // --- eyes follow the cursor anywhere on the desktop ---
      const REACH = 500 // px from face centre for full eye deflection
      let last = null
      window.widget.onCursor(({ x, y }) => {
        // x/y are relative to the window centre, so this doubles as a
        // hover test that works over the drag region.
        const inside = Math.abs(x) < innerWidth / 2 && Math.abs(y) < innerHeight / 2
        document.body.classList.toggle('hovered', inside)
        if (dragging) return
        const moved = !last || Math.abs(x - last.x) > 2 || Math.abs(y - last.y) > 2
        last = { x, y }
        // Only steer while the cursor is moving; when look() expires the
        // face's own idle wander takes back over.
        if (moved) {
          const clamp = (v) => Math.max(-1, Math.min(1, v / REACH))
          face.look(clamp(x), clamp(y), 1500)
        }
      })

      // --- personality ---
      const MOODS = [
        'idle', 'content', 'happy', 'curious', 'thinking', 'smug',
        'bored', 'sleepy', 'joy', 'suspicious', 'unimpressed', 'relieved',
      ]
      let mood = 'idle'
      function wander() {
        if (cfg.mood === 'auto' && !chatting && !sleeping) {
          mood = MOODS[Math.floor(Math.random() * MOODS.length)]
          face.setExpression(mood)
          if (Math.random() < 0.25) face.react(Math.random() < 0.5 ? 'wink' : 'bounce')
        }
        setTimeout(wander, 8000 + Math.random() * 14000)
      }
      setTimeout(wander, 6000)

      // --- the voice: syllable-level gibberish speech with real prosody.
      // Words are split into syllables; each syllable is a shaped note whose
      // pitch comes from its vowel, its word's identity, word stress, and
      // where the sentence is (declination, question rise, final fall).
      // Consonant onsets add articulation: plosives tick, fricatives hiss.
      // It voices the token stream itself, buffering split words, so speech
      // lasts exactly as long as the reply is arriving.
      let vctx = null
      let master = null
      let noiseBuf = null
      let vt = 0
      let sentencePos = 0 // words since the sentence began — pitch declines
      let wordBuf = '' // partial word carried between deltas

      let analyser = null
      let analyserData = null
      let analyserFreq = null
      let elBus = null
      let mHiS = 0 // smoothed treble share of the voice — "ee"-ness
      let mLoS = 0 // smoothed bass share — "oo"-ness
      function voiceInit() {
        vctx = new AudioContext()
        // everything audible flows through the analyser so the mouth can watch it
        analyser = vctx.createAnalyser()
        analyser.fftSize = 512
        analyserData = new Uint8Array(analyser.fftSize)
        analyserFreq = new Uint8Array(analyser.frequencyBinCount)
        analyser.connect(vctx.destination)
        elBus = vctx.createGain() // EL voice: full-range, no babble lowpass
        elBus.connect(analyser)
        master = vctx.createGain()
        master.gain.value = 0.9
        const lp = vctx.createBiquadFilter()
        lp.type = 'lowpass'
        lp.frequency.value = 3200
        master.connect(lp)
        lp.connect(analyser)
        noiseBuf = vctx.createBuffer(1, Math.round(vctx.sampleRate * 0.1), vctx.sampleRate)
        const d = noiseBuf.getChannelData(0)
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
      }

      const VOWEL_COLOR = { a: 1.0, e: 1.16, i: 1.32, o: 0.88, u: 0.78, y: 1.24 }
      const hash = (s) => {
        let h = 9
        for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 387420489)
        return ((h >>> 0) % 1000) / 1000
      }

      function tone(f, t, dur, peak, fallTo) {
        const o = vctx.createOscillator()
        const o2 = vctx.createOscillator()
        const g = vctx.createGain()
        const g2 = vctx.createGain()
        o.type = 'triangle'
        o2.type = 'sine'
        o.frequency.setValueAtTime(f * 0.95, t)
        o.frequency.exponentialRampToValueAtTime(fallTo || f * 1.04, t + dur)
        o2.frequency.setValueAtTime(f * 2, t)
        o2.frequency.exponentialRampToValueAtTime((fallTo || f) * 2, t + dur)
        g2.gain.value = 0.18 // soft octave partial for body
        g.gain.setValueAtTime(0, t)
        g.gain.linearRampToValueAtTime(peak, t + 0.012)
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04)
        o.connect(g)
        o2.connect(g2)
        g2.connect(g)
        g.connect(master)
        // a touch of vibrato on the longer (stressed) vowels
        if (dur > 0.062) {
          const l = vctx.createOscillator()
          const lg = vctx.createGain()
          l.frequency.value = 5.5
          lg.gain.value = f * 0.018
          l.connect(lg)
          lg.connect(o.frequency)
          l.start(t)
          l.stop(t + dur)
        }
        o.start(t)
        o2.start(t)
        o.stop(t + dur + 0.06)
        o2.stop(t + dur + 0.06)
      }

      function noiseHit(t, dur, kind, peak) {
        const src = vctx.createBufferSource()
        src.buffer = noiseBuf
        const f = vctx.createBiquadFilter()
        const g = vctx.createGain()
        f.type = kind === 'hiss' ? 'highpass' : 'bandpass'
        f.frequency.value = kind === 'hiss' ? 3800 : 1400
        g.gain.setValueAtTime(peak, t)
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
        src.connect(f)
        f.connect(g)
        g.connect(master)
        src.start(t)
        src.stop(t + dur + 0.01)
      }

      let phraseTone = 1 // each sentence starts on its own slight key
      function speakWord(word, punct, caps) {
        const pitch = cfg.voicePitch || 1
        if (sentencePos === 0) phraseTone = 0.96 + hash(word + 'P') * 0.08
        // per-word identity, plus natural declination across the sentence
        const base =
          300 *
          pitch *
          phraseTone *
          (1 + (hash(word) - 0.5) * 0.1) *
          Math.pow(0.985, Math.min(sentencePos, 10))
        const sylls = word.match(/[^aeiouy]*[aeiouy]+[^aeiouy]{0,2}/g) || [word]
        const q = punct.includes('?')
        const ex = punct.includes('!') || caps
        // stress usually leads, but some words carry it on the second syllable
        const stressIdx = sylls.length > 1 && hash(word + 'S') > 0.7 ? 1 : 0
        sylls.forEach((syl, i) => {
          const stressed = i === stressIdx
          const vowels = syl.match(/[aeiouy]/g) || ['a']
          let f = base * (VOWEL_COLOR[vowels[0]] || 1) * (stressed ? 1.09 : 0.96)
          if (q) f *= 1 + 0.2 * ((i + 1) / sylls.length) // rise into the '?'
          if (ex) f *= 1.1
          const jit = 1 + (hash(word + i) - 0.5) * 0.05
          const dur = (stressed ? 0.076 : 0.055) * (sylls.length > 2 ? 0.88 : 1)
          const onset = syl[0]
          if ('ptkbdg'.includes(onset)) noiseHit(vt, 0.016, 'tick', 0.05)
          else if ('sfzxhc'.includes(onset)) noiseHit(vt, 0.028, 'hiss', 0.022)
          const isLast = i === sylls.length - 1
          // sentence-final fall beats everything; diphthongs glide between
          // their two vowel colours; otherwise the default gentle up-bend
          let target
          if (isLast && punct.includes('.')) target = f * jit * 0.78
          else if (vowels.length > 1)
            target = base * (VOWEL_COLOR[vowels[1]] || 1) * jit * (stressed ? 1.09 : 0.96)
          tone(f * jit, vt, dur, (stressed ? 0.084 : 0.058) * (ex ? 1.25 : 1), target)
          vt += dur * 0.82
        })
        vt += 0.038 + hash(word + 'G') * 0.035 // organic word gap
        sentencePos++
        if (/[.!?]/.test(punct)) {
          sentencePos = 0
          vt += /[!?]/.test(punct) ? 0.15 : 0.2
        } else if (/[,;:]/.test(punct)) vt += 0.12
      }

      window.widget.onSpeak(({ text, done, hush }) => {
        if (cfg.voice === false) return
        try {
          if (!vctx) voiceInit()
        } catch {
          return
        }
        const now = vctx.currentTime
        if (hush) {
          // the text finished rendering — fade the remaining babble fast
          master.gain.cancelScheduledValues(now)
          master.gain.setValueAtTime(master.gain.value, now)
          master.gain.linearRampToValueAtTime(0.0001, now + 0.22)
          master.gain.setValueAtTime(0.9, now + 0.4) // ready for the next turn
          vt = now + 0.4
          wordBuf = ''
          sentencePos = 0
          return
        }
        if (vt < now + 0.03) vt = now + 0.03
        // don't voice URLs or markdown scaffolding
        const clean = (wordBuf + (text || '')).replace(/https?:\/\/\S+/g, ' link ')
        wordBuf = ''
        const parts = clean.split(/(\s+)/)
        let end = parts.length
        if (!done && end && !/\s/.test(parts[end - 1])) {
          wordBuf = parts[end - 1] // an unfinished word — wait for the rest
          end -= 1
        }
        for (let i = 0; i < end; i++) {
          if (vt > now + 2.5) {
            wordBuf = '' // never run far past the text; drop and skip ahead
            return
          }
          const tok = parts[i]
          if (!tok || /^\s+$/.test(tok)) continue
          const caps = (tok.match(/[A-Z]/g) || []).length >= 2 // SHOUTED words
          const m = tok.toLowerCase().replace(/[`*_#>[\]()~|=+-]/g, '')
          const word = m.replace(/[^a-z0-9']/g, '')
          const punct = m.replace(/[a-z0-9']/g, '')
          if (word) speakWord(word, punct, caps)
          else if (/[.!?]/.test(punct)) {
            sentencePos = 0
            vt += 0.15
          }
        }
      })

      // --- bot idle: nothing has happened TO homie — no chats, pokes, or
      // notifications — for 5 minutes → he dozes off. Interaction wakes him.
      let dozeTimer
      let lastActivity = Date.now()
      function activity() {
        lastActivity = Date.now()
        if (!sleeping) return
        sleeping = false
        clearTimeout(dozeTimer)
        face.react('bounce')
        face.setExpression(activeMood())
      }
      setInterval(() => {
        if (sleeping || chatting) return
        if (Date.now() - lastActivity > 5 * 60 * 1000) {
          sleeping = true
          face.setExpression('sleepy')
          dozeTimer = setTimeout(() => sleeping && face.setExpression('sleep'), 25000)
        }
      }, 10000)

      // --- ElevenLabs playback: raw 24kHz mono PCM chunks, queued gaplessly.
      // Bypasses the babble's lowpass chain — a real voice shouldn't be muffled.
      let elTime = 0
      let elSources = []
      let elStarted = false
      window.widget.onElAudio(({ b64, done, stop }) => {
        if (stop) {
          for (const s of elSources) {
            try {
              s.stop()
            } catch {}
          }
          elSources = []
          elTime = 0
          elStarted = false
          return
        }
        if (done) {
          // report when the last scheduled chunk actually finishes playing
          const wait = vctx ? Math.max(0, elTime - vctx.currentTime) * 1000 + 60 : 0
          setTimeout(() => {
            elStarted = false
            window.widget.elMark({ ended: true })
          }, wait)
          return
        }
        if (!b64) return
        try {
          if (!vctx) voiceInit()
        } catch {
          return
        }
        const bin = atob(b64)
        const n = bin.length >> 1
        if (!n) return
        const buf = vctx.createBuffer(1, n, 24000)
        const ch = buf.getChannelData(0)
        for (let i = 0; i < n; i++) {
          let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8)
          if (v >= 32768) v -= 65536
          ch[i] = v / 32768
        }
        const src = vctx.createBufferSource()
        src.buffer = buf
        src.connect(elBus)
        const now = vctx.currentTime
        if (elTime < now + 0.06) elTime = now + 0.06
        src.start(elTime)
        if (!elStarted) {
          elStarted = true
          const delay = Math.max(0, elTime - now) * 1000 + 30
          setTimeout(() => window.widget.elMark({ started: true }), delay)
        }
        elTime += buf.duration
        elSources.push(src)
        src.onended = () => (elSources = elSources.filter((s) => s !== src))
      })

      // --- a bot reached out: peep bubble up and perk up ---
      const peep = document.querySelector('#peep')
      let peepTimer = null

      // a cute two-note blip, synthesized so there's no asset to ship
      let audioCtx = null
      function blip() {
        try {
          audioCtx ??= new AudioContext()
          const t0 = audioCtx.currentTime
          const note = (freq, start, dur, peak = 0.15) => {
            const o = audioCtx.createOscillator()
            const g = audioCtx.createGain()
            o.type = 'sine'
            o.frequency.setValueAtTime(freq, t0 + start)
            g.gain.setValueAtTime(0, t0 + start)
            g.gain.linearRampToValueAtTime(peak, t0 + start + 0.012)
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur)
            o.connect(g).connect(audioCtx.destination)
            o.start(t0 + start)
            o.stop(t0 + start + dur + 0.05)
          }
          note(784, 0, 0.09) // G5…
          note(1175, 0.07, 0.16) // …up to D6: "bli-bloop"
        } catch {}
      }

      window.widget.onNotify(() => {
        activity()
        peep.hidden = false
        blip()
        if (!chatting) {
          clearTimeout(chatTimer)
          face.setExpression('excited')
          face.react('pop')
          face.react('bounce')
          chatTimer = setTimeout(() => face.setExpression(restMood()), 4000)
        }
        // a soft nudge now and then until it's read
        clearInterval(peepTimer)
        peepTimer = setInterval(() => !chatting && face.react('bounce'), 15000)
      })
      window.widget.onNotifyClear(() => {
        peep.hidden = true
        clearInterval(peepTimer)
      })

      // --- being dragged around ---
      let dragging = false
      let dropTimer
      window.widget.onDragging(() => {
        if (!dragging) {
          dragging = true
          face.setExpression('scared')
        }
        clearTimeout(dropTimer)
        dropTimer = setTimeout(() => {
          dragging = false
          face.react('boing')
          face.setExpression(restMood())
        }, 250)
      })

      applyColors()
      buildFace()

    </script>
  </body>
</html>
