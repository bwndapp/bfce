<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>bbot widget</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
        /* palette lives here so the peep bubble can wear it too */
        --face-skin: #16181a;
        --face-ink: #e9ebec;
        --face-ring: #2f3336;
      }
      /* Inset so reactions (shake, boing, …) can overshoot without
         clipping at the window edge. */
      #face {
        position: absolute;
        inset: 10%;
        /* clickable (click = chat, press-and-move = drag), so no OS drag region */
        -webkit-app-region: no-drag;
        cursor: grab;
      }
      #face:active {
        cursor: grabbing;
      }
      .ctl {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 50%;
        background: #16181a;
        color: #9aa0a6;
        font: 12px/1 sans-serif;
        padding: 0;
        opacity: 0;
        transition: opacity 0.15s;
        -webkit-app-region: no-drag;
        z-index: 2;
      }
      body.hovered .ctl {
        opacity: 0.6;
      }
      body.hovered .ctl:hover {
        opacity: 1;
        color: #fff;
      }
      #scale {
        top: 4px;
        left: 4px;
        cursor: nwse-resize;
      }
      #close {
        top: 4px;
        right: 4px;
        cursor: pointer;
      }
      #edit {
        bottom: 4px;
        left: 4px;
        cursor: pointer;
      }
      #talk {
        bottom: 4px;
        right: 4px;
        cursor: pointer;
      }
      /* unread notification: a big anime "!" right off the head */
      #peep {
        position: absolute;
        top: 0;
        right: 7%;
        font: 900 26vmin/0.9 system-ui, sans-serif;
        color: var(--face-ink);
        -webkit-text-stroke: 2vmin var(--face-skin);
        paint-order: stroke fill;
        transform: rotate(12deg);
        z-index: 3;
        pointer-events: none;
        animation:
          peekin 0.35s cubic-bezier(0.34, 1.8, 0.64, 1),
          bob 1.6s 0.35s ease-in-out infinite;
      }
      @keyframes peekin {
        from {
          opacity: 0;
          transform: rotate(12deg) scale(0.2) translateY(30%);
        }
      }
      @keyframes bob {
        50% {
          transform: rotate(12deg) translateY(-4%) scale(1.06);
        }
      }
      #peep[hidden] {
        display: none;
      }
      /* pending reply: a thought forming — bubbles pop in one after another,
         hold together, shrink away, repeat */
      #think {
        position: absolute;
        top: 3%;
        left: 9%;
        width: 19vmin;
        height: 19vmin;
        z-index: 3;
        pointer-events: none;
      }
      #think i {
        position: absolute;
        border-radius: 50%;
        background: var(--face-ink);
        border: 0.9vmin solid var(--face-skin);
        opacity: 0;
        animation: tcycle 2.2s ease-in-out infinite;
      }
      #think i:nth-child(1) {
        width: 3vmin;
        height: 3vmin;
        bottom: 0;
        right: 0;
      }
      #think i:nth-child(2) {
        width: 4.5vmin;
        height: 4.5vmin;
        bottom: 4.2vmin;
        right: 4.2vmin;
        animation-delay: 0.22s;
      }
      #think i:nth-child(3) {
        width: 7.5vmin;
        height: 7.5vmin;
        bottom: 9.5vmin;
        right: 9.5vmin;
        animation-delay: 0.44s;
      }
      @keyframes tcycle {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        12% {
          transform: scale(1.18);
          opacity: 1;
        }
        20% {
          transform: scale(1);
        }
        70% {
          transform: scale(1);
          opacity: 1;
        }
        84%,
        100% {
          transform: scale(0.5);
          opacity: 0;
        }
      }
      #think[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="face"></div>
    <button id="scale" class="ctl" title="Drag to resize">⤡</button>
    <button id="close" class="ctl" title="Close">✕</button>
    <button id="edit" class="ctl" title="Customize">✎</button>
    <button id="talk" class="ctl" title="Chat">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M3 2h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8.4l-3 2.5c-.4.35-1 .06-1-.46V12H3a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
      </svg>
    </button>
    <div id="peep" hidden>!</div>
    <div id="think" hidden><i></i><i></i><i></i></div>

    <script type="module">
      import { createFace } from '../dist/face.js'

      const faceEl = document.querySelector('#face')

      // --- config lives in the main process; both windows subscribe ---
      let cfg = await window.widget.getCfg()

      const luminance = (hex) => {
        const n = parseInt(hex.slice(1), 16)
        return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255
      }
      function applyColors() {
        // set on body: the face inherits, and so does the peep bubble
        document.body.style.setProperty('--face-skin', cfg.skin)
        document.body.style.setProperty('--face-ink', cfg.ink)
        // Keep the hairline visible on both light and dark skins.
        document.body.style.setProperty(
          '--face-ring',
          luminance(cfg.skin) > 0.5 ? 'rgba(0,0,0,.3)' : '#2f3336'
        )
      }

      // --- the face (rebuilt when pupils change; that option is creation-time) ---
      const activeMood = () => (cfg.mood === 'auto' ? mood : cfg.mood)
      let sleeping = false // system idle > 5 min
      const restMood = () => (sleeping ? 'sleep' : activeMood())
      let face
      function buildFace() {
        face?.destroy()
        face = createFace(faceEl, {
          expression: activeMood(),
          track: false,
          pupils: cfg.pupils,
        })
      }

      window.widget.onCfg((c) => {
        activity()
        const rebuild = c.pupils !== cfg.pupils
        cfg = c
        applyColors()
        if (rebuild) buildFace()
        else face.setExpression(restMood())
      })
      window.widget.onReact((name) => (activity(), face.react(name)))

      document.querySelector('#edit').addEventListener('click', () => window.widget.toggleSettings())
      document.querySelector('#talk').addEventListener('click', () => window.widget.toggleChat())

      // --- the face itself: click to chat, press-and-move to drag ---
      let pressing = null
      faceEl.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return
        activity()
        faceEl.setPointerCapture(e.pointerId)
        pressing = { x: e.screenX, y: e.screenY, moved: false }
      })
      faceEl.addEventListener('pointermove', (e) => {
        if (!pressing || pressing.moved) return
        if (Math.hypot(e.screenX - pressing.x, e.screenY - pressing.y) > 4) {
          pressing.moved = true
          window.widget.moveStart()
        }
      })
      faceEl.addEventListener('pointerup', () => {
        if (!pressing) return
        if (pressing.moved) window.widget.moveEnd()
        else window.widget.toggleChat()
        pressing = null
      })
      faceEl.addEventListener('lostpointercapture', () => {
        if (pressing?.moved) window.widget.moveEnd()
        pressing = null
      })

      // --- chat choreography: the face acts out the conversation ---
      let chatTimer
      let chatting = false
      const think = document.querySelector('#think')
      window.widget.onChatState(({ state, mood: replyMood, react }) => {
        activity()
        clearTimeout(chatTimer)
        chatting = state !== 'end'
        think.hidden = state !== 'thinking' && state !== 'tool'
        if (state === 'open') {
          face.setExpression('curious')
          face.react('pop')
          face.look(0, -0.6, 900) // glance up at the bubble window
        } else if (state === 'thinking') {
          face.setExpression('thinking')
          face.look(-0.4, -0.7, 2500)
        } else if (state === 'streaming') {
          // words are landing — look at the bubbles and talk
          face.setExpression('content')
          face.look(0, -0.6, 1200)
        } else if (state === 'tool') {
          face.setExpression('focus')
        } else if (state === 'error') {
          face.setExpression('worried')
          face.react('shake')
          chatTimer = setTimeout(() => face.setExpression(restMood()), 5000)
        } else if (state === 'reply') {
          face.setExpression(replyMood || 'content')
          if (react) face.react(react)
          // drift back to his own mood once the moment passes
          chatTimer = setTimeout(() => face.setExpression(restMood()), 7000)
        } else if (state === 'end') {
          face.setExpression(restMood())
        }
      })
      document.querySelector('#close').addEventListener('click', () => window.widget.quit())
      addEventListener('keydown', (e) => e.key === 'Escape' && window.widget.quit())

      // --- scale handle: main process sizes the window to follow the cursor ---
      const scale = document.querySelector('#scale')
      scale.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        scale.setPointerCapture(e.pointerId)
        window.widget.resizeStart()
      })
      scale.addEventListener('pointerup', () => window.widget.resizeEnd())
      scale.addEventListener('lostpointercapture', () => window.widget.resizeEnd())

      // --- eyes follow the cursor anywhere on the desktop ---
      const REACH = 500 // px from face centre for full eye deflection
      let last = null
      window.widget.onCursor(({ x, y }) => {
        // x/y are relative to the window centre, so this doubles as a
        // hover test that works over the drag region.
        const inside = Math.abs(x) < innerWidth / 2 && Math.abs(y) < innerHeight / 2
        document.body.classList.toggle('hovered', inside)
        if (dragging) return
        const moved = !last || Math.abs(x - last.x) > 2 || Math.abs(y - last.y) > 2
        last = { x, y }
        // Only steer while the cursor is moving; when look() expires the
        // face's own idle wander takes back over.
        if (moved) {
          const clamp = (v) => Math.max(-1, Math.min(1, v / REACH))
          face.look(clamp(x), clamp(y), 1500)
        }
      })

      // --- personality ---
      const MOODS = [
        'idle', 'content', 'happy', 'curious', 'thinking', 'smug',
        'bored', 'sleepy', 'joy', 'suspicious', 'unimpressed', 'relieved',
      ]
      let mood = 'idle'
      function wander() {
        if (cfg.mood === 'auto' && !chatting && !sleeping) {
          mood = MOODS[Math.floor(Math.random() * MOODS.length)]
          face.setExpression(mood)
          if (Math.random() < 0.25) face.react(Math.random() < 0.5 ? 'wink' : 'bounce')
        }
        setTimeout(wander, 8000 + Math.random() * 14000)
      }
      setTimeout(wander, 6000)

      // --- the voice: syllable-level gibberish speech with real prosody.
      // Words are split into syllables; each syllable is a shaped note whose
      // pitch comes from its vowel, its word's identity, word stress, and
      // where the sentence is (declination, question rise, final fall).
      // Consonant onsets add articulation: plosives tick, fricatives hiss.
      // It voices the token stream itself, buffering split words, so speech
      // lasts exactly as long as the reply is arriving.
      let vctx = null
      let master = null
      let noiseBuf = null
      let vt = 0
      let sentencePos = 0 // words since the sentence began — pitch declines
      let wordBuf = '' // partial word carried between deltas

      function voiceInit() {
        vctx = new AudioContext()
        master = vctx.createGain()
        master.gain.value = 0.9
        const lp = vctx.createBiquadFilter()
        lp.type = 'lowpass'
        lp.frequency.value = 3200
        master.connect(lp)
        lp.connect(vctx.destination)
        noiseBuf = vctx.createBuffer(1, Math.round(vctx.sampleRate * 0.1), vctx.sampleRate)
        const d = noiseBuf.getChannelData(0)
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
      }

      const VOWEL_COLOR = { a: 1.0, e: 1.16, i: 1.32, o: 0.88, u: 0.78, y: 1.24 }
      const hash = (s) => {
        let h = 9
        for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 387420489)
        return ((h >>> 0) % 1000) / 1000
      }

      function tone(f, t, dur, peak, fallTo) {
        const o = vctx.createOscillator()
        const o2 = vctx.createOscillator()
        const g = vctx.createGain()
        const g2 = vctx.createGain()
        o.type = 'triangle'
        o2.type = 'sine'
        o.frequency.setValueAtTime(f * 0.95, t)
        o.frequency.exponentialRampToValueAtTime(fallTo || f * 1.04, t + dur)
        o2.frequency.setValueAtTime(f * 2, t)
        o2.frequency.exponentialRampToValueAtTime((fallTo || f) * 2, t + dur)
        g2.gain.value = 0.18 // soft octave partial for body
        g.gain.setValueAtTime(0, t)
        g.gain.linearRampToValueAtTime(peak, t + 0.012)
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04)
        o.connect(g)
        o2.connect(g2)
        g2.connect(g)
        g.connect(master)
        // a touch of vibrato on the longer (stressed) vowels
        if (dur > 0.062) {
          const l = vctx.createOscillator()
          const lg = vctx.createGain()
          l.frequency.value = 5.5
          lg.gain.value = f * 0.018
          l.connect(lg)
          lg.connect(o.frequency)
          l.start(t)
          l.stop(t + dur)
        }
        o.start(t)
        o2.start(t)
        o.stop(t + dur + 0.06)
        o2.stop(t + dur + 0.06)
      }

      function noiseHit(t, dur, kind, peak) {
        const src = vctx.createBufferSource()
        src.buffer = noiseBuf
        const f = vctx.createBiquadFilter()
        const g = vctx.createGain()
        f.type = kind === 'hiss' ? 'highpass' : 'bandpass'
        f.frequency.value = kind === 'hiss' ? 3800 : 1400
        g.gain.setValueAtTime(peak, t)
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
        src.connect(f)
        f.connect(g)
        g.connect(master)
        src.start(t)
        src.stop(t + dur + 0.01)
      }

      let phraseTone = 1 // each sentence starts on its own slight key
      function speakWord(word, punct, caps) {
        const pitch = cfg.voicePitch || 1
        if (sentencePos === 0) phraseTone = 0.96 + hash(word + 'P') * 0.08
        // per-word identity, plus natural declination across the sentence
        const base =
          300 *
          pitch *
          phraseTone *
          (1 + (hash(word) - 0.5) * 0.1) *
          Math.pow(0.985, Math.min(sentencePos, 10))
        const sylls = word.match(/[^aeiouy]*[aeiouy]+[^aeiouy]{0,2}/g) || [word]
        const q = punct.includes('?')
        const ex = punct.includes('!') || caps
        // stress usually leads, but some words carry it on the second syllable
        const stressIdx = sylls.length > 1 && hash(word + 'S') > 0.7 ? 1 : 0
        sylls.forEach((syl, i) => {
          const stressed = i === stressIdx
          const vowels = syl.match(/[aeiouy]/g) || ['a']
          let f = base * (VOWEL_COLOR[vowels[0]] || 1) * (stressed ? 1.09 : 0.96)
          if (q) f *= 1 + 0.2 * ((i + 1) / sylls.length) // rise into the '?'
          if (ex) f *= 1.1
          const jit = 1 + (hash(word + i) - 0.5) * 0.05
          const dur = (stressed ? 0.076 : 0.055) * (sylls.length > 2 ? 0.88 : 1)
          const onset = syl[0]
          if ('ptkbdg'.includes(onset)) noiseHit(vt, 0.016, 'tick', 0.05)
          else if ('sfzxhc'.includes(onset)) noiseHit(vt, 0.028, 'hiss', 0.022)
          const isLast = i === sylls.length - 1
          // sentence-final fall beats everything; diphthongs glide between
          // their two vowel colours; otherwise the default gentle up-bend
          let target
          if (isLast && punct.includes('.')) target = f * jit * 0.78
          else if (vowels.length > 1)
            target = base * (VOWEL_COLOR[vowels[1]] || 1) * jit * (stressed ? 1.09 : 0.96)
          tone(f * jit, vt, dur, (stressed ? 0.084 : 0.058) * (ex ? 1.25 : 1), target)
          vt += dur * 0.82
        })
        vt += 0.038 + hash(word + 'G') * 0.035 // organic word gap
        sentencePos++
        if (/[.!?]/.test(punct)) {
          sentencePos = 0
          vt += /[!?]/.test(punct) ? 0.15 : 0.2
        } else if (/[,;:]/.test(punct)) vt += 0.12
      }

      window.widget.onSpeak(({ text, done, hush }) => {
        if (cfg.voice === false) return
        try {
          if (!vctx) voiceInit()
        } catch {
          return
        }
        const now = vctx.currentTime
        if (hush) {
          // the text finished rendering — fade the remaining babble fast
          master.gain.cancelScheduledValues(now)
          master.gain.setValueAtTime(master.gain.value, now)
          master.gain.linearRampToValueAtTime(0.0001, now + 0.22)
          master.gain.setValueAtTime(0.9, now + 0.4) // ready for the next turn
          vt = now + 0.4
          wordBuf = ''
          sentencePos = 0
          return
        }
        if (vt < now + 0.03) vt = now + 0.03
        // don't voice URLs or markdown scaffolding
        const clean = (wordBuf + (text || '')).replace(/https?:\/\/\S+/g, ' link ')
        wordBuf = ''
        const parts = clean.split(/(\s+)/)
        let end = parts.length
        if (!done && end && !/\s/.test(parts[end - 1])) {
          wordBuf = parts[end - 1] // an unfinished word — wait for the rest
          end -= 1
        }
        for (let i = 0; i < end; i++) {
          if (vt > now + 2.5) {
            wordBuf = '' // never run far past the text; drop and skip ahead
            return
          }
          const tok = parts[i]
          if (!tok || /^\s+$/.test(tok)) continue
          const caps = (tok.match(/[A-Z]/g) || []).length >= 2 // SHOUTED words
          const m = tok.toLowerCase().replace(/[`*_#>[\]()~|=+-]/g, '')
          const word = m.replace(/[^a-z0-9']/g, '')
          const punct = m.replace(/[a-z0-9']/g, '')
          if (word) speakWord(word, punct, caps)
          else if (/[.!?]/.test(punct)) {
            sentencePos = 0
            vt += 0.15
          }
        }
      })

      // --- bot idle: nothing has happened TO homie — no chats, pokes, or
      // notifications — for 5 minutes → he dozes off. Interaction wakes him.
      let dozeTimer
      let lastActivity = Date.now()
      function activity() {
        lastActivity = Date.now()
        if (!sleeping) return
        sleeping = false
        clearTimeout(dozeTimer)
        face.react('bounce')
        face.setExpression(activeMood())
      }
      setInterval(() => {
        if (sleeping || chatting) return
        if (Date.now() - lastActivity > 5 * 60 * 1000) {
          sleeping = true
          face.setExpression('sleepy')
          dozeTimer = setTimeout(() => sleeping && face.setExpression('sleep'), 25000)
        }
      }, 10000)

      // --- a bot reached out: peep bubble up and perk up ---
      const peep = document.querySelector('#peep')
      let peepTimer = null

      // a cute two-note blip, synthesized so there's no asset to ship
      let audioCtx = null
      function blip() {
        try {
          audioCtx ??= new AudioContext()
          const t0 = audioCtx.currentTime
          const note = (freq, start, dur, peak = 0.15) => {
            const o = audioCtx.createOscillator()
            const g = audioCtx.createGain()
            o.type = 'sine'
            o.frequency.setValueAtTime(freq, t0 + start)
            g.gain.setValueAtTime(0, t0 + start)
            g.gain.linearRampToValueAtTime(peak, t0 + start + 0.012)
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur)
            o.connect(g).connect(audioCtx.destination)
            o.start(t0 + start)
            o.stop(t0 + start + dur + 0.05)
          }
          note(784, 0, 0.09) // G5…
          note(1175, 0.07, 0.16) // …up to D6: "bli-bloop"
        } catch {}
      }

      window.widget.onNotify(() => {
        activity()
        peep.hidden = false
        blip()
        if (!chatting) {
          clearTimeout(chatTimer)
          face.setExpression('excited')
          face.react('pop')
          face.react('bounce')
          chatTimer = setTimeout(() => face.setExpression(restMood()), 4000)
        }
        // a soft nudge now and then until it's read
        clearInterval(peepTimer)
        peepTimer = setInterval(() => !chatting && face.react('bounce'), 15000)
      })
      window.widget.onNotifyClear(() => {
        peep.hidden = true
        clearInterval(peepTimer)
      })

      // --- being dragged around ---
      let dragging = false
      let dropTimer
      window.widget.onDragging(() => {
        if (!dragging) {
          dragging = true
          face.setExpression('scared')
        }
        clearTimeout(dropTimer)
        dropTimer = setTimeout(() => {
          dragging = false
          face.react('boing')
          face.setExpression(restMood())
        }, 250)
      })

      applyColors()
      buildFace()
    </script>
  </body>
</html>
